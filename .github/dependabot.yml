version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Angular packages must move together.
      angular:
        patterns:
          - '@angular/*'
          - 'angular-eslint'
    ignore:
      # Angular decides which TypeScript minor it supports; ng update moves it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The image's base images. Node.js follows .nvmrc and Java the server, so their majors move on
  # purpose.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
      - dependency-name: eclipse-temurin
        update-types: ['version-update:semver-major']
