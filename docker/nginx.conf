# The image's web server: serves the web client and passes the server's paths to the Dulo server,
# which listens on 127.0.0.1:8081 only. Runs as the unprivileged user dulo.

# A family tree has few visitors at a time; one worker per CPU core would be wasted memory.
worker_processes 2;
pid /tmp/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The Dulo server logs every request itself, with the client's address.
    access_log off;
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The scheme and port the browser used, for the server's absolute redirects (such as back to
    # /oauth2/authorize after the identity provider). Behind a TLS proxy, keep what it reports.
    # Without a port, Tomcat would assume the scheme's default and drop e.g. :8080.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
    }
    map $http_host $host_port {
        "~:(?<port>[0-9]+)$" $port;
        default '';
    }
    map "$http_x_forwarded_port|$host_port|$forwarded_proto" $forwarded_port {
        "~^(?<port>[0-9]+)\|" $port;
        "~^\|(?<port>[0-9]+)\|" $port;
        "~\|https$" 443;
        default 80;
    }

    upstream dulo_server {
        server 127.0.0.1:8081;
        keepalive 16;
    }

    server {
        listen 8080;

        root /srv/web;
        # The server enforces its own limits.
        client_max_body_size 50m;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_read_timeout 300s;

        # The server: API, authorization server, sign-in with the identity providers, health.
        location ^~ /api/ { proxy_pass http://dulo_server; }
        location ^~ /oauth2/ { proxy_pass http://dulo_server; }
        location ^~ /login/ { proxy_pass http://dulo_server; }
        location ^~ /connect/ { proxy_pass http://dulo_server; }
        location ^~ /.well-known/ { proxy_pass http://dulo_server; }
        location = /userinfo { proxy_pass http://dulo_server; }
        location ^~ /actuator/health { proxy_pass http://dulo_server; }

        # The web client. App routes such as /sign-in get index.html.
        location / {
            include /etc/dulo/security-headers.conf;
            try_files $uri /index.html;

            location = /index.html {
                expires -1;
            }

            # File names with a content hash never change.
            location ~* "-[A-Za-z0-9]{8}\.(?:js|css)$" {
                expires max;
            }

            location ^~ /i18n/ {
                expires -1;
                try_files $uri =404;
            }

            # A missing file is a 404, not the app.
            location ~ "\.[A-Za-z0-9]+$" {
                try_files $uri =404;
            }
        }
    }
}
