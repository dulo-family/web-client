<main class="home">
  <dulo-wordmark class="brand" />

  @if (treeValue(); as tree) {
    <h1>{{ tree.name }}</h1>
    @if (tree.description; as description) {
      <p class="description">{{ description }}</p>
    }
  } @else if (treeError(); as error) {
    <p class="error" role="alert">{{ error }}</p>
    <button duloButton variant="secondary" type="button" (click)="reload()">
      {{ 'home.retry' | transloco }}
    </button>
  } @else {
    <p class="muted" role="status">{{ 'home.loading' | transloco }}</p>
  }

  <footer class="account">
    @if (name(); as name) {
      <p class="muted">{{ 'home.signedInAs' | transloco: { name } }}</p>
    }
    <button
      duloButton
      variant="secondary"
      type="button"
      [disabled]="signOut.busy()"
      (click)="signOut()"
    >
      {{ 'home.signOut' | transloco }}
    </button>
  </footer>
</main>
