<ol class="rail">
  @for (step of steps(); track step.id; let index = $index) {
    <li class="step" [class]="step.state">
      @if (step.reachable && step.state !== 'current') {
        <button type="button" class="entry" (click)="selected.emit(step.id)">
          <span class="marker" aria-hidden="true">
            @if (step.state === 'done') {
              ✓
            } @else {
              {{ index + 1 }}
            }
          </span>
          <span class="name">{{ step.label }}</span>
          @if (step.state === 'done') {
            <span class="visually-hidden">({{ doneLabel() }})</span>
          }
        </button>
      } @else {
        <span class="entry" [attr.aria-current]="step.state === 'current' ? 'step' : null">
          <span class="marker" aria-hidden="true">
            @if (step.state === 'done') {
              ✓
            } @else {
              {{ index + 1 }}
            }
          </span>
          <span class="name">{{ step.label }}</span>
          @if (step.state === 'done') {
            <span class="visually-hidden">({{ doneLabel() }})</span>
          }
        </span>
      }
    </li>
  }
</ol>
